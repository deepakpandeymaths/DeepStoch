[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepstoch"
version = "0.1.0.dev0"
description = "An uncertainty-aware deep learning and stochastic modelling platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "DeepStoch Project Team"}]
dependencies = []

[project.optional-dependencies]
core = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5", "pydantic>=2.7", "pyyaml>=6.0"]
deep-learning = ["torch>=2.3"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
tracking = ["mlflow>=2.14"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
deepstoch = "deepstoch.cli:main"

[tool.setuptools.packages.find]
include = ["deepstoch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

